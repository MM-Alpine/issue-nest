services:
  postgres:
    image: postgres:16-alpine
    container_name: issuehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-issuehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-issuehub}
      POSTGRES_DB: ${POSTGRES_DB:-issuehub_dev}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-issuehub_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - issuehub_pgdata:/var/lib/postgresql/data
      # Runs only on an empty volume. Recreate the volume if the configured test database is missing.
      - ./docker/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-issuehub} -d ${POSTGRES_DB:-issuehub_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  issuehub_pgdata:
